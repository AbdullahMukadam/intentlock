name: intentlock-selfhost

x-server: &server
  image: ghcr.io/abdullahmukadam/intentlock-server:${INTENTLOCK_VERSION:-0.2.0}
  build:
    context: ..
    dockerfile: apps/server/Dockerfile

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: intentlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: intentlock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentlock"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *server
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      DIRECT_URL: postgresql://intentlock:${POSTGRES_PASSWORD}@postgres:5432/intentlock
    depends_on:
      postgres:
        condition: service_healthy

  server:
    <<: *server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://intentlock:${POSTGRES_PASSWORD}@postgres:5432/intentlock
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_POOL_TIMEOUT_MS: ${DATABASE_POOL_TIMEOUT_MS:-5000}
      DATABASE_TX_MAX_WAIT_MS: ${DATABASE_TX_MAX_WAIT_MS:-2000}
      DATABASE_TX_TIMEOUT_MS: ${DATABASE_TX_TIMEOUT_MS:-5000}
      SIGNING_KEY: ${SIGNING_KEY:?set SIGNING_KEY in .env}
      SIGNING_KEY_PREVIOUS: ${SIGNING_KEY_PREVIOUS:-}
      API_KEY_PEPPER: ${API_KEY_PEPPER:-}
      ORG_NAME: ${ORG_NAME:-Intentlock}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LICENSE_FILE: ${LICENSE_FILE:-}
      INTENTLOCK_DEMO: ${INTENTLOCK_DEMO:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 1
    volumes:
      - ./license:/license:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  inbox:
    image: ghcr.io/abdullahmukadam/intentlock-inbox:${INTENTLOCK_VERSION:-0.2.0}
    build:
      context: ..
      dockerfile: apps/inbox/Dockerfile
    restart: unless-stopped
    depends_on:
      - server

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      server:
        condition: service_healthy
      inbox:
        condition: service_started

configs:
  nginx:
    content: |
      map $$http_upgrade $$connection_upgrade {
        default upgrade;
        ""      close;
      }
      server {
        listen 80;
        client_max_body_size 5m;
        gzip on;
        gzip_proxied any;
        gzip_types application/json application/x-ndjson;
        proxy_set_header Host $$host;
        proxy_set_header X-Forwarded-For $$remote_addr;
        proxy_set_header X-Forwarded-Proto $$scheme;

        location /api/socket.io/ {
          proxy_pass http://server:3000/socket.io/;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_read_timeout 1h;
        }

        location /api/ {
          proxy_pass http://server:3000/;
          proxy_read_timeout 60s;
        }

        location / {
          proxy_pass http://inbox:3001;
        }
      }

volumes:
  pgdata:
