name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: intentlock
          POSTGRES_PASSWORD: intentlock
          POSTGRES_DB: intentlock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intentlock"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://intentlock:intentlock@localhost:5432/intentlock_test
      DIRECT_URL: postgresql://intentlock:intentlock@localhost:5432/intentlock_test
      TEST_DATABASE_URL: postgresql://intentlock:intentlock@localhost:5432/intentlock_test
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
