version: 1
default: block
rules:
  - id: forward-inside-only
    match: { tool: mail_forward }
    except: { args: { to: { glob: "*@acme-demo.dev" } } }
    decision: block
    reason: Mail is only forwarded to addresses inside acme-demo.dev

  - id: refund-known-accounts
    match: { tool: refund_issue }
    except:
      args:
        customer: { in: [sam@example.com, dana@example.com, lee@example.com, ravi@example.com] }
    decision: block
    reason: Refunds only go to known customer accounts

  - id: refund-limit
    match: { tool: refund_issue }
    except: { args: { amountUsd: { lte: 500 } } }
    decision: block
    reason: Refunds over $500 are handled by finance, not the assistant

  - id: interns-no-refunds
    match: { tool: refund_issue, user: { group: intern } }
    decision: block
    reason: Interns cannot issue refunds

  - id: leads-refund-up-to-limit
    match: { tool: refund_issue, user: { group: support-leads } }
    decision: allow

  - id: small-refunds
    match: { tool: refund_issue, args: { amountUsd: { lte: 20 } } }
    decision: allow

  - id: hold-refunds
    match: { tool: refund_issue }
    decision: hold
    approvers: { roles: [admin, approver] }
    timeoutSeconds: 600
    reason: Refunds over $20 are approved by a person

  - id: allow-in-plan
    match: { inPlan: true }
    decision: allow
