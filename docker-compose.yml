name: intentlock

services:
  postgres:
    image: postgres:16
    mem_limit: 512m
    cpus: 1
    environment:
      POSTGRES_USER: intentlock
      POSTGRES_PASSWORD: intentlock
      POSTGRES_DB: intentlock
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intentlock"]
      interval: 2s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31
    mem_limit: 128m
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

volumes:
  pgdata:
