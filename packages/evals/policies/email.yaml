version: 1
default: block
rules:
  - id: forward-inside-only
    match: { tool: mail_forward }
    except: { args: { to: { glob: "*@acme-demo.dev" } } }
    decision: block
    reason: Mail is only forwarded inside acme-demo.dev

  - id: refund-known-accounts
    match: { tool: refund_issue }
    except: { args: { customer: { in: [sam@example.com, dana@example.com, lee@example.com] } } }
    decision: block
    reason: Refunds only go to known customer accounts

  - id: refund-limit
    match: { tool: refund_issue }
    except: { args: { amountUsd: { lte: 500 } } }
    decision: block
    reason: Refunds over $500 are handled by finance

  - id: allow-in-plan
    match: { inPlan: true }
    decision: allow
